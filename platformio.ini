; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Conservative first-flash speed after a flash MD5 verification failure.
upload_speed = 57600
upload_port = COM5
build_src_filter = +<main.cpp>

; Standalone sensor checker: motor outputs stay LOW.
[env:sensor_check]
extends = env:esp32dev
build_src_filter = +<check_sensors.cpp>

; Motor-only test: starts both motors immediately after boot.
[env:motor_test]
extends = env:esp32dev
build_src_filter = +<test_motor.cpp>
